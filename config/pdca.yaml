# ============================================================
# 週次PDCAのしきい値（④）。ここを編集すれば改善ロジックの基準を変えられる（コード変更不要）。
# GA4(ページ閲覧) と Pinterest(露出/外部クリック) を突き合わせ、
# 各記事を Winner / Fixable / Loser / データ不足 に分類する。
# ============================================================

ga4:
  enabled: true
  lookback_days: 28          # GA4・Pinterestともに直近この日数を集計
  # ※数値の「プロパティID」を GA4_PROPERTY_ID(Secret/変数) に入れる。
  #   Measurement ID(G-GD1XLKR8S3)とは別物。GA管理 > プロパティ設定 で確認できる数字。

# 記事を分類するしきい値（lookback_days間の値で判定）
classify:
  min_impressions_to_judge: 30   # Pinterest露出がこれ未満かつPVも乏しい記事は「データ不足」(新しすぎ)で判定保留
  winner:
    min_pageviews: 50            # GA4: 期間中このPV以上なら勝ち筋
    min_outbound_ctr: 0.02       # または Pinterest: outbound_click / impression がこれ以上
  loser:
    max_pageviews: 5             # GA4: これ以下
    max_outbound_ctr: 0.003      # かつ Pinterest CTR がこれ以下なら低調
  # 上のどれにも当てはまらない（露出はあるが伸び切らない）→ Fixable

# Fixable/Loser への自動アクション
fix:
  enabled: true
  max_fixes_per_week: 3          # 1回の週次で手を入れる記事の上限（コスト/レート保護）
  flag_for_repin: true           # Fixableに needs_refresh フラグを立て、日次の再Pinで優先的に新角度を当てる
  rewrite_article: false         # 本文の作り直し（コスト高・LLM消費大）。既定OFF。trueで上位Fixableを再生成
  avoid_loser_keywords: true     # Loserのキーワードを strategy.avoid_keywords に寄せる
  boost_winner_keywords: true    # Winnerのキーワードを strategy.boost_keywords に寄せる

# ============================================================
# GSC連動SEOエンジン（src/seo.py）のしきい値
# ============================================================
# 2026-09-15: ここまで `seo:` セクションが無く、src/seo.py は既定値
# （lookback_days 28 / min_impressions 20）で動いていた。GSC連携自体は生きていて
# 毎週「GSC: 43ページ / 40クエリ取得」まで成功しているのに、結果は毎回
# 「リライト0 / あと一歩0 / 新規ネタ0」だった。
#
# 理由は単純で、しきい値がこのサイトの実トラフィックに対して高すぎる。
# 実測(2026-09-14のGSC): 28日の総表示299、ページ最大43、クエリ最大5。
# min_impressions 20 だと、クエリは1件も通らずページもほぼ全滅する。
# 一方3ヶ月で見ると寿司クラスタが357表示・順位5.4〜10.7と明確な資産になっている。
# → 集計窓を広げ、足切りを実データの桁に合わせる。数字が育ったら戻すこと。
seo:
  enabled: true
  lookback_days: 90          # 28日では母数が足りない。3ヶ月なら寿司/キッチン系が判定可能な量になる
  min_impressions: 5         # 28日のクエリ最大が5表示。20のままだと永久に何も通らない
  low_ctr_max: 0.02          # 既定のまま（上位なのにCTRが低い＝タイトル/メタ改善の対象）
  striking_min_pos: 8.0      # 「あと一歩」の定義は動かさない。広げると改善対象がぼやける
  striking_max_pos: 20.0
  max_title_rewrites: 3      # 1週あたりの自動リライト上限。手組みページ(assets/pages)は元々対象外
  max_new_topics: 3          # コンテンツギャップからtopics_queueへ入れる上限

# 週次レポート
report:
  write_markdown: true
  path: "data/weekly_report.md"  # 毎週ここに上書き。Actionsがcommitするのでリポジトリで履歴も追える
  keep_history_weeks: 12         # state に残す週次サマリの数
