# =====================================================================
# 施策3-1: エンティティ・ホワイトリスト（実在確認済みの固有名詞の単一情報源）
#
# 目的: マネーページ/記事に書いてよいホテル名・商品名・施設名を一元管理する。
#   ここに無い固有名詞を含む記事は自動公開しない（entity_scan.py がレビュー送り）。
#
# ルール（指示書 §2-0 / §3-1）:
#   * 各エントリは必ず「公式サイト or Booking/Klook の実ページ」で実在確認したもの。
#     「もっともらしいから」で足さない。確認できないものは書かない。
#   * verified_url … 実在確認に使ったURL（公式優先）。
#   * verified_date … 確認した日付（YYYY-MM-DD）。空 or 6ヶ月超は週次レビューで再確認対象。
#   * status: verified … 確認済み。 pending_url … 掲載中だが公式URL再確認待ち（Phase 2-1で埋める）。
#
# 追記手順: Phase 2-1 のマネーページ再構築時、候補を fetch 検証 → ここに登録 → 記事に実名注入。
# =====================================================================

